name: CI

# Format, lints and tests on Linux, Windows and macOS, each on Intel/AMD
# and ARM. The sample disk images aren't in the repository, so CI runs
# only the built-in tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Intel/AMD and ARM machines of each kind: macos-latest is Apple
        # Silicon, macos-15-intel an Intel Mac.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
